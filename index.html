<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>万枚ファンタジア A-TYPE Ver.0.9.3</title>
<link rel="stylesheet" href="css/style.css">
</head><body><div id="runtimeError" style="display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:10000;background:#5c0b14;color:white;border:1px solid #ff6f7d;border-radius:9px;padding:9px;font:12px monospace"></div><main class="machine">
<div class="cabinet-top"><img src="images/cabinet/cabinet_top.png" alt="万枚ファンタジア"></div><div class="ver">A-TYPE Ver.0.9.3</div>
<section class="cab"><div id="manLamp" class="lamp">◇ 万 ◇</div><div style="text-align:center;color:#ffd65c;font-weight:900;font-size:12px;margin:-4px 0 9px">SETTING 6</div>
<div class="hud"><div class="cell"><small>CREDIT</small><b id="credit">50</b></div><div class="cell"><small>BET</small><b id="bet">0</b></div><div class="cell"><small>PAY</small><b id="pay">0</b></div><div class="cell"><small>GAME</small><b id="game">0</b></div></div>
<div class="window"><div class="line"></div><div class="reel"><div id="leftStrip" class="strip"></div></div><div class="reel"><div id="centerStrip" class="strip"></div></div><div class="reel"><div id="rightStrip" class="strip"></div></div></div>
<div class="lower-shell">
  <img class="lower-shell-art" src="images/cabinet/cabinet_bottom.png" alt="">
  <div class="controls modern-controls">
  <div class="frog-corner frog-left"><img src="images/frogs/frog_03.png" alt=""></div>
  <div class="frog-corner frog-right"><img src="images/frogs/frog_04.png" alt=""></div>

  <div class="control-grid">
    <div class="left-control">
      <button id="betBtn" class="maxbet-btn"><span class="small">MAX</span><span>BET</span></button>
      <button id="leverBtn" class="lever-modern" aria-label="LEVER ON">
        <span class="lever-ball"></span><span class="lever-stem"></span><span class="lever-base"></span>
      </button>
      <div class="lever-label">LEVER</div>
    </div>

    <div class="right-control">
      <div class="stop-label">STOP BUTTON</div>
      <div class="stops modern-stops">
        <button id="stopL" class="stop modern-stop" disabled><span>1</span></button>
        <button id="stopC" class="stop modern-stop" disabled><span>2</span></button>
        <button id="stopR" class="stop modern-stop" disabled><span>3</span></button>
      </div>
      <button id="autoBtn" class="auto-btn" type="button">AUTO OFF</button>
    </div>
  </div>

  <div id="status" class="status">MAX BETしてレバーON</div>
  <div class="subcontrols">
    <button id="paytableBtn" class="paytable-btn">成立役一覧 / 配当表</button>
    <div class="soundRow">
      <button id="soundBtn" class="soundBtn">SOUND ON</button>
      <div class="volume-control">
        <button id="volumeDown" class="volume-btn" type="button">−</button>
        <span class="volume-icon">🔊</span>
        <input id="volumeSlider" class="volume-slider" type="range" min="0" max="100" value="65" step="5" aria-label="音量">
        <span id="volumeValue" class="volume-value">65%</span>
        <button id="volumeUp" class="volume-btn" type="button">＋</button>
      </div>
    </div>
  </div>
  <div class="note">Ver.0.9.3：21コマ×3リール配列を正式化。非成立役の入賞形を回避する停止制御を追加。</div>
</div>
</div></section></main>

<div id="paytableModal" class="paytable-modal" aria-hidden="true">
  <div class="paytable-wrap">
    <button id="paytableClose" class="paytable-close" aria-label="閉じる">×</button>
    <img src="images/ui/paytable.png" class="paytable-img" alt="万枚ファンタジア A-TYPE 成立役一覧">
  </div>
</div>


<audio id="bgmBig1" src="audio/bgm/bgm_01.mp3" preload="auto"></audio>
<audio id="bgmBig2" src="audio/bgm/bgm_04.mp3" preload="auto"></audio>
<audio id="bgmBig3" src="audio/bgm/bgm_03.mp3" preload="auto"></audio>
<audio id="bgmBar" src="audio/bgm/bgm_02.mp3" preload="auto"></audio>


<audio id="seLeverFile" preload="auto" src="audio/se/lever.mp3"></audio>
<audio id="seStopFile" preload="auto" src="audio/se/stop.mp3"></audio>
<audio id="seBellFile" preload="auto" src="audio/se/bell.mp3"></audio>
<audio id="seReplayFile" preload="auto" src="audio/se/replay.mp3"></audio>
<audio id="seCherryFile" preload="auto" src="audio/se/cherry.mp3"></audio>
<audio id="seTenpaiFile" preload="auto" src="audio/se/bonus_tenpai.mp3"></audio>

<script src="js/game.js"></script>
</body></html>
