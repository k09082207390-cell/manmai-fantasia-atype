<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>万枚ファンタジア A-TYPE Ver.0.7.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#31160d,#09090d 48%,#020203);color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:16px}
.machine{width:min(850px,100%)}.logo{text-align:center}.logo img{width:min(520px,90vw);max-height:160px;object-fit:contain}.ver{text-align:center;color:#d6b46d;font-size:12px;font-weight:900;letter-spacing:.14em;margin-bottom:8px}
.cab{padding:16px;border-radius:28px;border:3px solid #8d5d20;background:linear-gradient(145deg,#28140e,#09090b 32%,#1b1013);box-shadow:inset 0 0 0 3px #ffd76d44,0 20px 50px #000}
.lamp{height:48px;border:2px solid #59401d;border-radius:16px;display:flex;justify-content:center;align-items:center;font-size:26px;font-weight:1000;color:#50300c;background:#0d0907;margin-bottom:10px;transition:.18s}.lamp.on{color:#fff7b2;background:radial-gradient(circle,#fff596 0,#ffc72c 28%,#8d3b00 58%,#150800 100%);text-shadow:0 0 8px #fff,0 0 22px #ffd21f;box-shadow:0 0 28px #ffc400aa,inset 0 0 20px #fff6}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.cell{background:#020203;border:1px solid #40372f;border-radius:9px;padding:7px;text-align:center}.cell small{display:block;color:#948a81;font-size:8px;letter-spacing:.12em}.cell b{font:900 23px ui-monospace,monospace}
.window{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px;background:#050505;border:4px solid #c59034;border-radius:14px;overflow:hidden}.line{position:absolute;z-index:9;left:8px;right:8px;top:50%;height:3px;background:#ff263a;box-shadow:0 0 10px #ff263a}
.reel{height:330px;overflow:hidden;background:#fff;border:2px solid #222;border-radius:5px;position:relative}.reel:before,.reel:after{content:"";position:absolute;left:0;right:0;height:33%;z-index:4;pointer-events:none}.reel:before{top:0;background:linear-gradient(#0008,transparent)}.reel:after{bottom:0;background:linear-gradient(transparent,#0008)}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}.symbol{height:110px;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:center}.symbol img{max-width:88%;max-height:92px;object-fit:contain;filter:drop-shadow(0 2px 2px #0005)}
.controls{margin-top:13px;padding:13px;border:1px solid #67491f;border-radius:16px;background:#0a0a0c}.topBtns{display:flex;gap:10px;justify-content:center}.btn{height:50px;border-radius:999px;border:2px solid #775322;background:linear-gradient(#39281d,#120d0b);color:#fff;font-weight:1000;padding:0 28px}.bet{color:#ffda61}.lever{height:58px;color:#fff0aa}.btn:disabled,.stop:disabled{opacity:.35;cursor:default}.stops{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:11px}.stop{height:64px;border-radius:15px;border:3px solid #741421;background:radial-gradient(circle,#f34b59,#a20b18 65%,#43040a);color:#fff;font-weight:1000;font-size:16px;box-shadow:inset 0 0 14px #fff3,0 5px 10px #000}.stop.ready{box-shadow:0 0 18px #ff2039,inset 0 0 15px #fff5}.status{text-align:center;min-height:24px;margin-top:10px;color:#ffe1a0;font-weight:900}.note{text-align:center;font-size:10px;color:#9c9187;margin-top:7px}

.symbol-seven img{width:126%;height:126%;max-width:none;max-height:none;object-fit:contain}
.symbol-bar img{width:112%;height:112%;max-width:none;max-height:none;object-fit:contain}
.symbol-bell img,.symbol-cherry img,.symbol-watermelon img,.symbol-replay img{width:88%;height:88%;object-fit:contain}

@media(max-width:650px){body{padding:5px}.cab{padding:8px}.reel{height:240px}.symbol{height:80px}.symbol img{max-height:66px}.hud{grid-template-columns:repeat(2,1fr)}}

.paytable-btn{
  margin-top:10px;padding:10px 20px;border:2px solid #d7a928;border-radius:10px;
  background:linear-gradient(#4a0b0b,#170303);color:#ffd95a;font-weight:900;
  letter-spacing:.08em;cursor:pointer;box-shadow:0 0 14px #d7a92855;
}
.paytable-modal{
  display:none;position:fixed;inset:0;z-index:9999;background:#000e;
  align-items:center;justify-content:center;padding:18px;box-sizing:border-box;
}
.paytable-modal.open{display:flex}
.paytable-wrap{position:relative;max-width:1500px;width:100%;max-height:96vh;text-align:center}
.paytable-img{max-width:100%;max-height:90vh;object-fit:contain;border:2px solid #d7a928;border-radius:10px}
.paytable-close{
  position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:50%;
  border:2px solid #fff;background:#111d;color:#fff;font-size:28px;font-weight:bold;cursor:pointer
}

.soundRow{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.soundBtn{padding:8px 14px;border-radius:10px;border:1px solid #76562a;background:#17110d;color:#ffd76c;font-weight:900;cursor:pointer}
.soundBtn.off{opacity:.45}
</style></head><body><div id="runtimeError" style="display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:10000;background:#5c0b14;color:white;border:1px solid #ff6f7d;border-radius:9px;padding:9px;font:12px monospace"></div><main class="machine">
<div class="logo"><img src="logo.png"></div><div class="ver">A-TYPE Ver.0.7.1</div>
<section class="cab"><div id="manLamp" class="lamp">◇ 万 ◇</div><div style="text-align:center;color:#ffd65c;font-weight:900;font-size:12px;margin:-4px 0 9px">SETTING 6</div>
<div class="hud"><div class="cell"><small>CREDIT</small><b id="credit">50</b></div><div class="cell"><small>BET</small><b id="bet">0</b></div><div class="cell"><small>PAY</small><b id="pay">0</b></div><div class="cell"><small>GAME</small><b id="game">0</b></div></div>
<div class="window"><div class="line"></div><div class="reel"><div id="leftStrip" class="strip"></div></div><div class="reel"><div id="centerStrip" class="strip"></div></div><div class="reel"><div id="rightStrip" class="strip"></div></div></div>
<div class="controls"><div class="topBtns"><button id="betBtn" class="btn bet">3 BET</button><button id="leverBtn" class="btn lever">LEVER ON</button></div>
<div class="stops"><button id="stopL" class="stop" disabled>STOP 1</button><button id="stopC" class="stop" disabled>STOP 2</button><button id="stopR" class="stop" disabled>STOP 3</button></div>
<div id="status" class="status">3 BETしてレバーON</div>
<button id="paytableBtn" class="paytable-btn">成立役一覧 / 配当表</button>
<div class="soundRow"><button id="soundBtn" class="soundBtn">SOUND ON</button></div><div class="note">Ver.0.7.1：音声処理をゲーム本体から分離。音声エラー時もリール操作を継続。</div></div></section></main>

<div id="paytableModal" class="paytable-modal" aria-hidden="true">
  <div class="paytable-wrap">
    <button id="paytableClose" class="paytable-close" aria-label="閉じる">×</button>
    <img src="paytable.png" class="paytable-img" alt="万枚ファンタジア A-TYPE 成立役一覧">
  </div>
</div>


<audio id="bgmBig1" src="big_bonus_1.mp3" preload="auto"></audio>
<audio id="bgmBig2" src="big_bonus_2.mp3" preload="auto"></audio>
<audio id="bgmBig3" src="big_bonus_3.mp3" preload="auto"></audio>
<audio id="bgmBar" src="bar_bonus.mp3" preload="auto"></audio>

<script>
const S={seven:"seven.png",bar:"bar.png",bell:"bell.png",cherry:"cherry.png",watermelon:"watermelon.png",replay:"replay.png"};
const R={
 left:["bell","seven","replay","cherry","replay","watermelon","bell","replay","bar","cherry","replay","bell","watermelon","replay","bell","cherry","replay","bar","bell","replay","watermelon"],
 center:["replay","seven","watermelon","bell","replay","bar","bell","replay","bar","bell","replay","watermelon","bell","replay","bell","replay","watermelon","bar","bell","replay","bell"],
 right:["watermelon","seven","replay","bell","replay","watermelon","bell","replay","bar","replay","replay","bell","watermelon","replay","bell","replay","bell","bar","bell","replay","watermelon"]
};
const E=id=>document.getElementById(id),H=()=>innerWidth<=650?80:110;

window.addEventListener("error",e=>{
 const b=document.getElementById("runtimeError");
 if(b){b.style.display="block";b.textContent=`ERROR: ${e.message} (${e.lineno||"?"})`;}
});


let soundOn=true,audioCtx=null,currentBgm=null,bigBgmIndex=0;

function safeAudioContext(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    if(!audioCtx)audioCtx=new AC();
    if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});
    return audioCtx;
  }catch(e){
    console.warn("AudioContext unavailable:",e);
    return null;
  }
}
function tone(freq,d=.06,vol=.035,type="square",delay=0){
  if(!soundOn)return;
  try{
    const c=safeAudioContext();
    if(!c)return;
    const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(Math.max(.0001,vol),s);
    g.gain.exponentialRampToValueAtTime(.0001,s+d);
    o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d);
  }catch(e){console.warn("SE skipped:",e);}
}
const SE={
 bet(){try{tone(220,.05,.035,"square");tone(330,.05,.02,"square",.04)}catch(e){}},
 lever(){try{tone(115,.08,.05,"sawtooth");tone(170,.07,.035,"square",.05)}catch(e){}},
 stop(n){try{tone(480+n*70,.04,.04,"square")}catch(e){}},
 bell(){try{tone(660,.05,.03,"triangle");tone(880,.06,.025,"triangle",.05)}catch(e){}},
 replay(){try{tone(420,.05,.025,"triangle");tone(520,.06,.02,"triangle",.05)}catch(e){}},
 rare(){try{tone(260,.07,.05,"sawtooth");tone(780,.09,.035,"square",.07)}catch(e){}},
 chance(){try{[320,520,760].forEach((f,i)=>tone(f,.08,.04,"square",i*.05))}catch(e){}},
 bonus(){try{[392,523,659,784].forEach((f,i)=>tone(f,.13,.055,"triangle",i*.08))}catch(e){}}
};
function stopBgm(){
  try{
    if(currentBgm){currentBgm.pause();currentBgm.currentTime=0;}
  }catch(e){console.warn("BGM stop skipped:",e);}
  currentBgm=null;
}
function playBgm(id){
  if(!soundOn)return;
  try{
    stopBgm();
    const a=E(id);
    if(!a)return;
    a.volume=.65;a.loop=true;a.currentTime=0;
    const promise=a.play();
    if(promise&&typeof promise.catch==="function"){
      promise.catch(e=>console.warn("BGM play blocked:",e));
    }
    currentBgm=a;
  }catch(e){
    console.warn("BGM skipped:",e);
    currentBgm=null;
  }
}
function startBonusBgm(type){
  try{
    if(type==="REG"){playBgm("bgmBar");return;}
    const ids=["bgmBig1","bgmBig2","bgmBig3"];
    playBgm(ids[bigBgmIndex%ids.length]);
    bigBgmIndex++;
  }catch(e){console.warn("Bonus BGM skipped:",e);}
}

let credit=50,bet=0,pay=0,game=0,spinning=false,order=0,currentRole="MISS";
let off={left:0,center:0,right:0},timer={},stopped={left:true,center:true,right:true};
let bonusStock=null;      // BIG or REG waiting to be aligned
let bonusMode=null;       // BIG or REG currently being played
let bonusLeft=0;
let bonusTotal=0;

const SETTING=6;
const P={
  BIG:1/220,
  REG:1/260,
  WEAK_CHERRY:1/55,
  STRONG_CHERRY:1/320,
  WATERMELON:1/75,
  CHANCE:1/140,
  BELL:1/6.2,
  REPLAY:1/7.3
};
const BONUS_RATE={
  WEAK_CHERRY:.03,
  STRONG_CHERRY:.45,
  WATERMELON:.08,
  CHANCE:.22
};

function drawRole(){
 if(bonusStock) return bonusStock==="BIG"?"BIG_ALIGN":"REG_ALIGN";
 if(bonusMode) return Math.random()<.76?"BELL":(Math.random()<.55?"REPLAY":"MISS");

 // One internal role per game. Rare roles are checked before common roles.
 const r=Math.random();
 let c=0;
 const roles=[
   ["STRONG_CHERRY",P.STRONG_CHERRY],
   ["CHANCE",P.CHANCE],
   ["WATERMELON",P.WATERMELON],
   ["WEAK_CHERRY",P.WEAK_CHERRY],
   ["BELL",P.BELL],
   ["REPLAY",P.REPLAY]
 ];
 for(const [role,prob] of roles){
   c+=prob;
   if(r<c){
     if(BONUS_RATE[role] && Math.random()<BONUS_RATE[role]){
       bonusStock=Math.random()<.56?"BIG":"REG";
     }
     return role;
   }
 }
 // Standalone bonus lottery.
 if(Math.random()<P.BIG){bonusStock="BIG";return "MISS";}
 if(Math.random()<P.REG){bonusStock="REG";return "MISS";}
 return "MISS";
}
function build(k){
 const strip=E(k+"Strip"),seq=[...R[k],...R[k],...R[k]];
 strip.innerHTML=seq.map(x=>`<div class="symbol symbol-${x}"><img src="${S[x]}" alt="${x}"></div>`).join("");
 off[k]=R[k].length*H();strip.style.transform=`translateY(-${off[k]}px)`;
}
["left","center","right"].forEach(build);

function sync(){
 E("credit").textContent=credit;E("bet").textContent=bet;E("pay").textContent=pay;E("game").textContent=game;
 E("betBtn").disabled=spinning||bet||credit<3;
 E("leverBtn").disabled=spinning||bet!==3;
}
function roleSymbol(role){
 return {BIG:"seven",REG:"bar",BIG_ALIGN:"seven",REG_ALIGN:"bar",BELL:"bell",REPLAY:"replay",WATERMELON:"watermelon",WEAK_CHERRY:"cherry",STRONG_CHERRY:"cherry"}[role]||null;
}
function findIndex(k,role){
 if((role==="WEAK_CHERRY"||role==="STRONG_CHERRY")&&k!=="left")return null;
 const sym=roleSymbol(role); if(!sym)return null;
 const c=[];R[k].forEach((x,i)=>{if(x===sym)c.push(i)});
 return c.length?c[Math.floor(Math.random()*c.length)]:null;
}
function setCenter(k,idx){
 const h=H(),n=R[k].length;
 if(idx==null)idx=Math.floor(Math.random()*n);
 off[k]=(n+idx-1)*h;
 const strip=E(k+"Strip");
 strip.style.transition="transform .10s cubic-bezier(.2,.75,.35,1)";
 strip.style.transform=`translateY(-${off[k]}px)`;
 setTimeout(()=>strip.style.transition="",120);
}
E("betBtn").onclick=()=>{
 if(credit<3||bet)return;
 credit-=3;bet=3;pay=0;try{SE.bet();}catch(e){console.warn("audio ignored",e);}
 E("status").textContent=bonusStock?`${bonusStock==="BIG"?"7":"BAR"}を狙え！`:"レバーON！";
 sync();
};
function start(k,speed){
 stopped[k]=false;const strip=E(k+"Strip"),total=R[k].length*H();
 timer[k]=setInterval(()=>{
   off[k]-=speed;if(off[k]<=total*.15)off[k]+=total;
   strip.style.transform=`translateY(-${off[k]}px)`;
 },16);
}
E("leverBtn").onclick=()=>{
 if(spinning||bet!==3)return;
 spinning=true;game++;order=0;pay=0;currentRole=drawRole();try{SE.lever();}catch(e){console.warn("audio ignored",e);}
 if(bonusStock){
   E("status").textContent=`${bonusStock==="BIG"?"7":"BAR"}を狙え！`;
 }else if(bonusMode){
   E("status").textContent=`${bonusMode} BONUS 残り${bonusLeft}G`;
 }else{
   E("status").textContent="回転中… STOP!";
 }
 if(!bonusStock&&!bonusMode)E("manLamp").classList.remove("on");
 start("left",23);start("center",25);start("right",27);
 ["stopL","stopC","stopR"].forEach(id=>{E(id).disabled=false;E(id).classList.add("ready")});
 sync();
};
function stop(k,b){
 if(!spinning||stopped[k])return;
 clearInterval(timer[k]);stopped[k]=true;
 let forced=(currentRole==="MISS")?null:findIndex(k,currentRole);
 // Strong cherry: left cherry + right 7 as a provisional strong-cherry stop form.
 if(currentRole==="STRONG_CHERRY" && k==="right") forced=findIndex("right","BIG");
 // Chance pattern: intentionally create a conspicuous non-paying mixed stop.
 if(currentRole==="CHANCE"){
   if(k==="left") forced=findIndex("left","WATERMELON");
   if(k==="center") forced=findIndex("center","BELL");
   if(k==="right") forced=findIndex("right","BIG");
 }
 setCenter(k,forced);
 b.disabled=true;b.classList.remove("ready");order++;
 if(order===3)finish();
}
function finish(){
 spinning=false;bet=0;let msg="ハズレ";

 if(currentRole==="BIG_ALIGN"||currentRole==="REG_ALIGN"){
   const type=bonusStock;
   bonusStock=null;bonusMode=type;
   bonusLeft=type==="BIG"?30:12;bonusTotal=0;
   E("manLamp").classList.add("on");
   msg=`${type} BONUS START!`;try{SE.bonus();}catch(e){console.warn("audio ignored",e);}startBonusBgm(type);
 }
 else if(currentRole==="BIG"||currentRole==="REG"){
   bonusStock=currentRole;
   E("manLamp").classList.add("on");
   msg=`${currentRole} 内部成立！ 次G ${currentRole==="BIG"?"7":"BAR"}を狙え`;
 }
 else if(currentRole==="BELL"){
   pay=bonusMode?15:8;credit+=pay;bonusTotal+=bonusMode?pay:0;msg=`ベル +${pay}枚`;try{SE.bell();}catch(e){console.warn("audio ignored",e);}
 }
 else if(currentRole==="REPLAY"){
   pay=3;credit+=3;msg="リプレイ";try{SE.replay();}catch(e){console.warn("audio ignored",e);}
 }
 else if(currentRole==="WATERMELON"){
   pay=8;credit+=8;msg="スイカ +8枚";try{SE.rare();}catch(e){console.warn("audio ignored",e);}
 }
 else if(currentRole==="WEAK_CHERRY"){
   pay=1;credit+=1;msg="弱チェリー +1枚";try{SE.rare();}catch(e){console.warn("audio ignored",e);}
 }
 else if(currentRole==="STRONG_CHERRY"){
   pay=1;credit+=1;msg="強チェリー +1枚";try{SE.chance();}catch(e){console.warn("audio ignored",e);}
 }
 else if(currentRole==="CHANCE"){
   pay=0;msg="チャンス目！";try{SE.chance();}catch(e){console.warn("audio ignored",e);}
 }

 if(bonusStock && !bonusMode && currentRole!=="BIG_ALIGN" && currentRole!=="REG_ALIGN"){
   E("manLamp").classList.add("on");
   msg+=` / ${bonusStock}同時当選！ 次G ${bonusStock==="BIG"?"7":"BAR"}を狙え`;
 }
 if(bonusMode && currentRole!=="BIG_ALIGN" && currentRole!=="REG_ALIGN"){
   bonusLeft--;
   if(bonusLeft<=0){
     msg+=` / ${bonusMode}終了 TOTAL ${bonusTotal}枚`;
     bonusMode=null;bonusTotal=0;stopBgm();
     E("manLamp").classList.remove("on");
   }else{
     msg+=` / 残り${bonusLeft}G`;
   }
 }
 E("status").textContent=msg;sync();
}
E("stopL").onclick=()=>stop("left",E("stopL"));
E("stopC").onclick=()=>stop("center",E("stopC"));
E("stopR").onclick=()=>stop("right",E("stopR"));

E("paytableBtn").onclick=()=>{
  E("paytableModal").classList.add("open");
  E("paytableModal").setAttribute("aria-hidden","false");
};
E("paytableClose").onclick=closePaytable;
E("paytableModal").onclick=e=>{if(e.target===E("paytableModal"))closePaytable()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePaytable()});
function closePaytable(){
  E("paytableModal").classList.remove("open");
  E("paytableModal").setAttribute("aria-hidden","true");
}


E("soundBtn").onclick=()=>{
 soundOn=!soundOn;
 E("soundBtn").textContent=soundOn?"SOUND ON":"SOUND OFF";
 E("soundBtn").classList.toggle("off",!soundOn);
 if(!soundOn)stopBgm();
};

sync();
</script></body></html>
