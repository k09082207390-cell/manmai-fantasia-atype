.reel{

<script>
var ASSIST_COMA=5;

let missPlan=null;


const S={seven:"images_symbols_seven.png",bar:"images_symbols_bar.png",bell:"images_symbols_bell.png",cherry:"images_symbols_cherry.png",watermelon:"images_symbols_watermelon.png",replay:"images_symbols_replay.png"};
const R={
 left:[
   "seven", "replay", "bell", "watermelon", "replay", "cherry", "replay", "bell", "bar", "watermelon", "bell", "replay", "bell", "cherry", "replay", "seven", "bell", "replay", "watermelon", "bell", "replay"
 ],
 center:[
   "replay", "seven", "bell", "watermelon", "replay", "bar", "bell", "replay", "watermelon", "bell", "replay", "seven", "bell", "watermelon", "replay", "bar", "bell", "replay", "bell", "watermelon", "replay"
 ],
 right:[
   "replay", "seven", "bell", "replay", "watermelon", "bell", "replay", "bar", "bell", "replay", "watermelon", "replay", "bell", "seven", "watermelon", "bell", "replay", "bar", "bell", "replay", "watermelon"
 ]
};
const E=id=>document.getElementById(id),H=()=>innerWidth<=650?80:110;

window.addEventListener("error",e=>{
 const b=document.getElementById("runtimeError");
 if(b){b.style.display="block";b.textContent=`ERROR: ${e.message} (${e.lineno||"?"})`;}
});


let soundOn=true,audioCtx=null,currentBgm=null,bigBgmIndex=0,masterVolume=.65;
let reelMotorNodes=null;

function safeAudioContext(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    if(!audioCtx)audioCtx=new AC();
    if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});
    return audioCtx;
  }catch(e){
    console.warn("AudioContext unavailable:",e);
    return null;
  }
}
function tone(freq,d=.06,vol=.035,type="square",delay=0){
  if(!soundOn)return;
  try{
    const c=safeAudioContext();
    if(!c)return;
    const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(Math.max(.0001,vol*masterVolume),s);
    g.gain.exponentialRampToValueAtTime(.0001,s+d);
    o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d);
  }catch(e){console.warn("SE skipped:",e);}
}

function noiseBurst(d=.06,vol=.025,filterFreq=1200){
 if(!soundOn)return;
 try{
   const c=safeAudioContext(); if(!c)return;
   const len=Math.max(1,Math.floor(c.sampleRate*d));
   const buf=c.createBuffer(1,len,c.sampleRate);
   const data=buf.getChannelData(0);
   for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
   const src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
   src.buffer=buf;f.type="bandpass";f.frequency.value=filterFreq;f.Q.value=.8;
   g.gain.value=vol*masterVolume;
   src.connect(f);f.connect(g);g.connect(c.destination);src.start();
 }catch(e){console.warn("noise SE skipped:",e);}
}
function startReelMotor(){
 if(!soundOn || reelMotorNodes)return;
 try{
   const c=safeAudioContext(); if(!c)return;
   const osc=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
   osc.type="sawtooth";osc.frequency.value=92;
   f.type="lowpass";f.frequency.value=520;
   g.gain.value=.016*masterVolume;
   osc.connect(f);f.connect(g);g.connect(c.destination);osc.start();
   reelMotorNodes={osc,g,f};
 }catch(e){console.warn("motor SE skipped:",e);}
}
function stopReelMotor(){
 try{
   if(reelMotorNodes){
     const c=safeAudioContext();
     reelMotorNodes.g.gain.setTargetAtTime(.0001,c.currentTime,.025);
     setTimeout(()=>{try{reelMotorNodes.osc.stop()}catch(e){} reelMotorNodes=null;},90);
   }
 }catch(e){reelMotorNodes=null;}
}

function playFileSE(id,rate=1,vol=1){
 if(!soundOn)return;
 try{
   const base=E(id); if(!base)return;
   const a=base.cloneNode(true);
   a.volume=Math.max(0,Math.min(1,masterVolume*vol));
   a.playbackRate=rate;
   const pr=a.play();
   if(pr&&pr.catch)pr.catch(()=>{});
 }catch(e){console.warn("file SE skipped:",e);}
}
const SE={
 bet(){
   tone(190,.045,.075,"square");
   tone(285,.05,.055,"square",.035);
   noiseBurst(.045,.035,1700);
 },
 lever(){
   playFileSE("seLeverFile",1,1);
 },
 stop(n){
   playFileSE("seStopFile",1+(n-1)*.018,1);
 },
 bell(){
   playFileSE("seBellFile",1,1);
 },
 replay(){
   playFileSE("seReplayFile",1,1);
 },
 rare(){
   tone(250,.065,.07,"sawtooth");
   tone(700,.08,.055,"square",.06);
   noiseBurst(.06,.03,1400);
 },
 chance(){
   [320,520,760,1040].forEach((f,i)=>tone(f,.075,.055,"square",i*.045));
 },
 bonus(){
   [392,523,659,784].forEach((f,i)=>tone(f,.13,.07,"triangle",i*.08));
 }
};
function stopBgm(){
  try{
    if(currentBgm){currentBgm.pause();currentBgm.currentTime=0;}
  }catch(e){console.warn("BGM stop skipped:",e);}
  currentBgm=null;
}
function playBgm(id){
  if(!soundOn)return;
  try{
    stopBgm();
    const a=E(id);
    if(!a)return;
    a.volume=masterVolume;a.loop=true;a.currentTime=0;
    const promise=a.play();
    if(promise&&typeof promise.catch==="function"){
      promise.catch(e=>console.warn("BGM play blocked:",e));
    }
    currentBgm=a;
  }catch(e){
    console.warn("BGM skipped:",e);
    currentBgm=null;
  }
}
function startBonusBgm(type){
  try{
    if(type==="REG"){playBgm("bgmBar");return;}
    const ids=["bgmBig1","bgmBig2","bgmBig3"];
    playBgm(ids[bigBgmIndex%ids.length]);
    bigBgmIndex++;
  }catch(e){console.warn("Bonus BGM skipped:",e);}
}

let credit=50,bet=0,pay=0,game=0,spinning=false,waiting=false,order=0,currentRole="MISS";
let off={left:0,center:0,right:0},timer={},stopped={left:true,center:true,right:true};
let stopHit={left:false,center:false,right:false};
 missPlan=currentRole==="MISS"?mfChooseMissPlan():null;
let replayReady=false;
let bonusStock=null;      // BIG / REG: internal bonus carried until aligned
let bonusMode=null;       // BIG / REG currently paying out
let bonusTotal=0;
let bonusTarget=0;
let lastSpinStart=0;
let refillCount=0;

const SETTING=6;
const BET_PER_GAME=3;
const CREDIT_MAX=50;
/* ASSIST_COMA initialized earlier: 5 */
const REEL_WAIT_MS=1500;

const P={
  BIG:1/220,
  REG:1/260,
  WEAK_CHERRY:1/55,
  STRONG_CHERRY:1/320,
  WATERMELON:1/75,
  CHANCE:1/140,
  BELL:1/6.2,
  REPLAY:1/7.3
};
const BONUS_RATE={
  WEAK_CHERRY:.03,
  STRONG_CHERRY:.45,
  WATERMELON:.08,
  CHANCE:.22
};

function drawRole(){
 if(bonusStock) return bonusStock==="BIG"?"BIG_ALIGN":"REG_ALIGN";
 if(bonusMode) return Math.random()<.76?"BELL":(Math.random()<.55?"REPLAY":"MISS");

 const r=Math.random();
 let c=0;
 const roles=[
   ["STRONG_CHERRY",P.STRONG_CHERRY],
   ["CHANCE",P.CHANCE],
   ["WATERMELON",P.WATERMELON],
   ["WEAK_CHERRY",P.WEAK_CHERRY],
   ["BELL",P.BELL],
   ["REPLAY",P.REPLAY]
 ];
 for(const [role,prob] of roles){
   c+=prob;
   if(r<c){
     if(BONUS_RATE[role] && Math.random()<BONUS_RATE[role]){
       bonusStock=Math.random()<.56?"BIG":"REG";
     }
     return role;
   }
 }
 if(Math.random()<P.BIG){bonusStock="BIG";return "MISS";}
 if(Math.random()<P.REG){bonusStock="REG";return "MISS";}
 return "MISS";
}

function build(k){
 const strip=E(k+"Strip"),seq=[...R[k],...R[k],...R[k]];
 strip.innerHTML=seq.map(x=>`<div class="symbol symbol-${x}"><img src="${S[x]}" alt="${x}"></div>`).join("");
 off[k]=R[k].length*H();
 strip.style.transform=`translateY(-${off[k]}px)`;
}
["left","center","right"].forEach(build);

function sync(){
 E("credit").textContent=credit;
 E("bet").textContent=bet;
 E("pay").textContent=pay;
 E("game").textContent=game;

 const needBet=!replayReady && bet!==BET_PER_GAME;
 E("betBtn").disabled=spinning||waiting||!needBet;
 E("leverBtn").disabled=spinning||waiting||bet!==BET_PER_GAME;

 if(replayReady && !spinning && !waiting && bet!==BET_PER_GAME){
   bet=BET_PER_GAME;
   E("bet").textContent=bet;
   E("leverBtn").disabled=false;
 }
}
function ensureCredit(){
 if(credit>=BET_PER_GAME)return false;
 credit=CREDIT_MAX;
 refillCount++;
 E("status").textContent=`CREDIT自動補充 → ${CREDIT_MAX}枚`;
 return true;
}
function awardCoins(n){
 const room=Math.max(0,CREDIT_MAX-credit);
 const toCredit=Math.min(room,n);
 credit+=toCredit;
 const overflow=n-toCredit;
 if(overflow>0)pay+=overflow;
 return {toCredit,overflow};
}
function roleSymbol(role){
 return {
  BIG_ALIGN:"seven",REG_ALIGN:"bar",
  BELL:"bell",REPLAY:"replay",WATERMELON:"watermelon",
  WEAK_CHERRY:"cherry",STRONG_CHERRY:"cherry"
 }[role]||null;
}
function norm(v,n){return ((v%n)+n)%n}





function visibleTriplet(k,centerIdx){
 const arr=R[k],n=arr.length;
 return {
   top:arr[norm(centerIdx-1,n)],
   middle:arr[norm(centerIdx,n)],
   bottom:arr[norm(centerIdx+1,n)]
 };
}
function centerSymbol(k){
 const idx=pressedCenterIndex(k);
 return R[k][norm(idx,R[k].length)];
}

function cherryPosition(){
 const idx=pressedCenterIndex("left");
 const trip=visibleTriplet("left",idx);
 if(trip.top==="cherry")return "TOP";
 if(trip.middle==="cherry")return "MIDDLE";
 if(trip.bottom==="cherry")return "BOTTOM";
 return "NONE";
}
function findCherryStop(kind){
 const n=R.left.length;
 const press=pressedCenterIndex("left");
 for(let slide=0;slide<=ASSIST_COMA;slide++){
   const center=norm(press-slide,n);
   const trip=visibleTriplet("left",center);
   if(kind==="WEAK" && (trip.top==="cherry"||trip.bottom==="cherry")){
     return {idx:center,slide,hit:true};
   }
   if(kind==="STRONG" && trip.middle==="cherry"){
     return {idx:center,slide,hit:true};
   }
 }
 return {idx:press,slide:0,hit:false};
}

function isWinningSymbolTriplet(a,b,c){
 return (a==="bell"&&b==="bell"&&c==="bell") ||
        (a==="replay"&&b==="replay"&&c==="replay") ||
        (a==="watermelon"&&b==="watermelon"&&c==="watermelon") ||
        (a==="seven"&&b==="seven"&&c==="seven") ||
        (a==="bar"&&b==="bar"&&c==="bar");
}
function accidentalHit(leftIdx,centerIdx,rightIdx){
 const L=visibleTriplet("left",leftIdx),C=visibleTriplet("center",centerIdx),Rr=visibleTriplet("right",rightIdx);

 // Standard 5 lines: top, middle, bottom, diagonal down, diagonal up.
 const lines=[
   [L.top,C.top,Rr.top],
   [L.middle,C.middle,Rr.middle],
   [L.bottom,C.bottom,Rr.bottom],
   [L.top,C.middle,Rr.bottom],
   [L.bottom,C.middle,Rr.top]
 ];
 if(lines.some(x=>isWinningSymbolTriplet(...x)))return true;

 // Cherry is treated as a left-reel pay symbol. Avoid showing cherry on active left positions on MISS.
 if(L.top==="cherry"||L.middle==="cherry"||L.bottom==="cherry")return true;
 return false;
}
function chooseLegalMissCenters(){
 const n=R.left.length;
 // Prefer centers close to current stop position so MISS still feels like a natural stop.
 const base={
   left:pressedCenterIndex("left"),
   center:pressedCenterIndex("center"),
   right:pressedCenterIndex("right")
 };
 let best=null,bestCost=1e9;
 for(let dl=-5;dl<=5;dl++){
   const li=norm(base.left+dl,n);
   for(let dc=-5;dc<=5;dc++){
     const ci=norm(base.center+dc,n);
     for(let dr=-5;dr<=5;dr++){
       const ri=norm(base.right+dr,n);
       if(accidentalHit(li,ci,ri))continue;
       const cost=Math.abs(dl)+Math.abs(dc)+Math.abs(dr);
       if(cost<bestCost){best={left:li,center:ci,right:ri};bestCost=cost}
     }
   }
 }
 return best||base;
}

function pressedCenterIndex(k){
 const n=R[k].length,h=H();
 return norm(Math.round(off[k]/h)-n+1,n);
}
function findAssistIndex(k,symbol,maxSlide=ASSIST_COMA){
 if(!symbol)return null;
 const arr=R[k],n=arr.length,press=pressedCenterIndex(k);
 // Reel visual moves toward decreasing strip indexes in this implementation.
 for(let slide=0;slide<=maxSlide;slide++){
   const idx=norm(press-slide,n);
   if(arr[idx]===symbol)return {idx,slide,hit:true};
 }
 return {idx:press,slide:0,hit:false};
}

/* ===== Ver.0.9.9.6 FORMAL STOP TABLE ===== */
function mfFiveLinesFromCenters(li,ci,ri){
 const L=visibleTriplet("left",li), C=visibleTriplet("center",ci), Rr=visibleTriplet("right",ri);
 return [
   [L.top,C.top,Rr.top],
   [L.middle,C.middle,Rr.middle],
   [L.bottom,C.bottom,Rr.bottom],
   [L.top,C.middle,Rr.bottom],
   [L.bottom,C.middle,Rr.top]
 ];
}
function mfLineTriple(lines,sym){
 return lines.some(x=>x[0]===sym && x[1]===sym && x[2]===sym);
}
function mfAnyPayingTriple(lines){
 return ["replay","bell","watermelon","seven","bar"].some(s=>mfLineTriple(lines,s));
}
function mfCandidateCenters(k,maxSlide=ASSIST_COMA){
 const n=R[k].length, press=pressedCenterIndex(k), out=[];
 for(let slide=0;slide<=maxSlide;slide++){
   out.push({idx:norm(press-slide,n),slide});
 }
 return out;
}
function mfChooseRoleStop(k,role){
 const candidates=mfCandidateCenters(k,ASSIST_COMA);

 // チェリーは左リール専用停止テーブル
 if(k==="left" && role==="WEAK_CHERRY"){
   for(const c of candidates){
     const t=visibleTriplet("left",c.idx);
     if(t.top==="cherry" || t.bottom==="cherry") return {...c,hit:true,reason:"WEAK_CHERRY_CORNER"};
   }
   return {...candidates[0],hit:false,reason:"WEAK_CHERRY_MISS"};
 }
 if(k==="left" && role==="STRONG_CHERRY"){
   for(const c of candidates){
     const t=visibleTriplet("left",c.idx);
     if(t.middle==="cherry") return {...c,hit:true,reason:"STRONG_CHERRY_MIDDLE"};
   }
   return {...candidates[0],hit:false,reason:"STRONG_CHERRY_MISS"};
 }

 // スイカ・ベル・リプレイ・BONUSは成立図柄を5コマ以内から最短で引き込む
 const symbol=roleSymbol(role);
 if(symbol){
   for(const c of candidates){
     if(R[k][c.idx]===symbol) return {...c,hit:true,reason:"ROLE_PULL"};
   }
 }

 return {...candidates[0],hit:false,reason:"FREE"};
}
function mfChooseMissPlan(){
 const lc=mfCandidateCenters("left",ASSIST_COMA);
 const cc=mfCandidateCenters("center",ASSIST_COMA);
 const rc=mfCandidateCenters("right",ASSIST_COMA);

 let best=null,bestScore=1e9;
 for(const l of lc){
  for(const c of cc){
   for(const r of rc){
    const lines=mfFiveLinesFromCenters(l.idx,c.idx,r.idx);

    // ハズレ時は有効役を絶対に完成させない。
    if(mfAnyPayingTriple(lines)) continue;

    // ハズレ時の左チェリー表示も避ける。
    const lt=visibleTriplet("left",l.idx);
    if(lt.top==="cherry"||lt.middle==="cherry"||lt.bottom==="cherry") continue;

    // BAR下段狙いは軽く優遇。ただし停止優先順位は「近い停止」が最優先。
    let bonus=0;
    if(lt.bottom==="bar") bonus=-0.7;
    const score=l.slide+c.slide+r.slide+bonus;
    if(score<bestScore){
      bestScore=score;
      best={left:l.idx,center:c.idx,right:r.idx,slides:{left:l.slide,center:c.slide,right:r.slide}};
    }
   }
  }
 }
 if(best) return best;

 // 理論上ほぼ来ない安全フォールバック
 return {
   left:pressedCenterIndex("left"),
   center:pressedCenterIndex("center"),
   right:pressedCenterIndex("right"),
   slides:{left:0,center:0,right:0}
 };
}


function findLeftBottomBarAssist(){
 const arr=R.left, n=arr.length;
 const press=pressedCenterIndex("left");

 // 「少しだけ」アシスト：押した位置から最大2コマだけ見る
 // 下段にBARが来る center index を探す
 for(let slide=0; slide<=2; slide++){
   const center=norm(press-slide,n);
   const trip=visibleTriplet("left",center);
   if(trip.bottom==="bar"){
     return {idx:center,slide,hit:true};
   }
 }
 return {idx:press,slide:0,hit:false};
}

function targetFor(k,role){
 if(role==="WEAK_CHERRY"){
   if(k!=="left")return null;
   return "cherry";
 }
 if(role==="STRONG_CHERRY"){
   if(k==="left")return "cherry";
   if(k==="right")return "seven";
   return null;
 }
 if(role==="CHANCE"){
   return {left:"watermelon",center:"bell",right:"seven"}[k];
 }
 return roleSymbol(role);
}
function setCenter(k,idx,slide=0){
 const h=H(),n=R[k].length;
 if(idx==null)idx=pressedCenterIndex(k);
 off[k]=(n+idx-1)*h;
 const strip=E(k+"Strip");
 const dur=Math.min(.22,.075+slide*.025);
 strip.style.transition=`transform ${dur}s cubic-bezier(.12,.78,.22,1)`;
 strip.style.transform=`translateY(-${off[k]}px)`;
 setTimeout(()=>strip.style.transition="",Math.ceil(dur*1000)+35);
}
function flashCabinet(kind){
 const cab=document.querySelector(".cab");
 if(!cab)return;
 const cls={
  WEAK_CHERRY:"flash-red",
  STRONG_CHERRY:"flash-red3",
  WATERMELON:"flash-green",
  CHANCE:"flash-chance"
 }[kind];
 if(!cls)return;
 cab.classList.remove(cls);
 void cab.offsetWidth;
 cab.classList.add(cls);
 setTimeout(()=>cab.classList.remove(cls),kind==="STRONG_CHERRY"?850:620);
}
function updateBonusGlow(){
 const cab=document.querySelector(".cab");
 if(!cab)return;
 cab.classList.toggle("rainbow-hold",!!bonusStock && !bonusMode);
 cab.classList.toggle("bonus-active",!!bonusMode);
 if(bonusStock)E("manLamp").classList.add("on");
 else if(!bonusMode)E("manLamp").classList.remove("on");
}
function allBonusSymbolsCaptured(){
 return stopHit.left && stopHit.center && stopHit.right;
}
function roleCapturedOriginal(){
 try{
 const L=centerSymbol("left"), C=centerSymbol("center"), RR=centerSymbol("right");

 if(currentRole==="REPLAY") return L==="replay" && C==="replay" && RR==="replay";
 if(currentRole==="BELL") return L==="bell" && C==="bell" && RR==="bell";
 if(currentRole==="WATERMELON") return L==="watermelon" && C==="watermelon" && RR==="watermelon";

 // 弱チェリー：左リール上段 or 下段（角チェリー）
 if(currentRole==="WEAK_CHERRY"){
   const pos=cherryPosition();
   return pos==="TOP" || pos==="BOTTOM";
 }

 // 強チェリー：左リール中段チェリー
 if(currentRole==="STRONG_CHERRY"){
   return cherryPosition()==="MIDDLE";
 }

 if(currentRole==="CHANCE") return false;
 return stopHit.left && stopHit.center && stopHit.right;
 }catch(e){
   console.warn("roleCaptured fallback:",e);
   return stopHit.left && stopHit.center && stopHit.right;
 }
}
function roleCaptured(){
  try{
    const L=visibleTriplet("left",pressedCenterIndex("left"));
    const C=visibleTriplet("center",pressedCenterIndex("center"));
    const RR=visibleTriplet("right",pressedCenterIndex("right"));
    const lines=[
      [L.top,C.top,RR.top],
      [L.middle,C.middle,RR.middle],
      [L.bottom,C.bottom,RR.bottom],
      [L.top,C.middle,RR.bottom],
      [L.bottom,C.middle,RR.top]
    ];
    const hit3=(s)=>lines.some(x=>x.every(v=>v===s));
    if(currentRole==="REPLAY") return hit3("replay");
    if(currentRole==="BELL") return hit3("bell");
    if(currentRole==="WATERMELON") return hit3("watermelon");
    return roleCapturedOriginal();
  }catch(e){
    return stopHit.left && stopHit.center && stopHit.right;
  }
}

 if(spinning||waiting||bet===BET_PER_GAME)return;

 E("status").textContent=bonusStock?`${bonusStock==="BIG"?"7":"BAR"}を狙え！（5コマアシスト）`:"3枚掛け完了 / レバーON";

function start(k,speed){
 stopped[k]=false;
 const strip=E(k+"Strip"),total=R[k].length*H();
 timer[k]=setInterval(()=>{
   off[k]-=speed;
   if(off[k]<=total*.15)off[k]+=total;
   strip.style.transform=`translateY(-${off[k]}px)`;
 },16);
}
function actuallyStartSpin(){
 waiting=false;
 spinning=true;
 game++;
 order=0;
 stopHit={left:false,center:false,right:false};
 lastSpinStart=Date.now();

 if(bonusStock){
   E("status").textContent=`${bonusStock==="BIG"?"7":"BAR"}を狙え！ 最大5コマ引込`;
 }else if(bonusMode){
   E("status").textContent=`${bonusMode} BONUS ${bonusTotal}/${bonusTarget}枚`;
 }else{
   E("status").textContent=currentRole==="WATERMELON"?"スイカ成立：各リールBARを狙え！":"回転中… STOP!";
 }
 updateBonusGlow();
 startReelMotor();
 start("left",45);start("center",49);start("right",53);
 ["stopL","stopC","stopR"].forEach(id=>{E(id).disabled=false;E(id).classList.add("ready")});

}
E("leverBtn").onclick=()=>{
 if(spinning||waiting||bet!==BET_PER_GAME)return;

 // Internal role is decided at LEVER ON, even if the reel wait is still active.
 currentRole=drawRole();
 try{SE.lever();}catch(e){console.warn("audio ignored",e);}
 updateBonusGlow();

 const elapsed=Date.now()-lastSpinStart;
 const wait=Math.max(0,REEL_WAIT_MS-elapsed);
 if(wait>35 && lastSpinStart>0){
   waiting=true;
   E("status").innerHTML=`WAIT <span class="wait-badge">${(wait/1000).toFixed(1)}s</span>`;
   sync();
   setTimeout(actuallyStartSpin,wait);
 }else{
   actuallyStartSpin();
 }
};

function stop(k,b){
 if(!spinning||stopped[k])return;
 clearInterval(timer[k]);
 stopped[k]=true;

 const target=targetFor(k,currentRole);
 let idx=pressedCenterIndex(k),slide=0,hit=false;

 if(currentRole==="MISS" && missPlan){
   idx=missPlan[k];
   slide=(missPlan.slides && Number.isFinite(missPlan.slides[k]))?missPlan.slides[k]:0;
   hit=true;
 }else{
   const tableStop=mfChooseRoleStop(k,currentRole);
   idx=tableStop.idx;
   slide=tableStop.slide;
   hit=tableStop.hit;

   // チェリー以外の成立役は従来targetフラグと整合
   if(!hit && target){
     const assist=findAssistIndex(k,target,ASSIST_COMA);
     idx=assist.idx;slide=assist.slide;hit=assist.hit;
   }
 }
 stopHit[k]=target?hit:true;
 setCenter(k,idx,slide);

 b.disabled=true;b.classList.remove("ready");
 order++;
 try{SE.stop(order);}catch(e){console.warn("audio ignored",e);}
 if(order===2 && bonusStock && !bonusMode){
   const stoppedKeys=["left","center","right"].filter(x=>stopped[x]);
   if(stoppedKeys.length===2 && stoppedKeys.every(x=>stopHit[x])){
     setTimeout(()=>playFileSE("seTenpaiFile",1,1),70);
   }
 }
 if(order===3){
   stopReelMotor();
   setTimeout(finish,150);
 }
}

function startBonus(type){
 mfSetBonusWait();
 bonusStock=null;
 bonusMode=type;
 bonusTotal=0;
 bonusTarget=type==="BIG"?250:100;
 replayReady=false;
 updateBonusGlow();
 try{SE.bonus();}catch(e){console.warn("audio ignored",e);}
 startBonusBgm(type);
 return `${type} BONUS START! 目標 ${bonusTarget}枚`;
}
function endBonus(){
 const type=bonusMode,total=bonusTotal;
 bonusMode=null;bonusTotal=0;bonusTarget=0;
 stopBgm();updateBonusGlow();
 return `${type}終了 TOTAL ${total}枚`;
}

function finish(){
 spinning=false;
 let msg="ハズレ";
 // 5ラインの見た目入賞を最終確認
 try{
   const L=visibleTriplet("left",pressedCenterIndex("left"));
   const C=visibleTriplet("center",pressedCenterIndex("center"));
   const RR=visibleTriplet("right",pressedCenterIndex("right"));
   const lines=[[L.top,C.top,RR.top],[L.middle,C.middle,RR.middle],[L.bottom,C.bottom,RR.bottom],[L.top,C.middle,RR.bottom],[L.bottom,C.middle,RR.top]];
   const hit3=(s)=>lines.some(x=>x.every(v=>v===s));
   if(currentRole==="MISS"){
     if(hit3("replay")) currentRole="REPLAY";
     else if(hit3("bell")) currentRole="BELL";
     else if(hit3("watermelon")) currentRole="WATERMELON";
   }
 }catch(e){}
 const captured=roleCaptured();

 // BONUS is never started by internal hit alone. All 3 bonus symbols must be aligned.
 if(currentRole==="BIG_ALIGN"||currentRole==="REG_ALIGN"){
   if(allBonusSymbolsCaptured()){
     msg=startBonus(bonusStock);
   }else{
     msg=`${bonusStock}成立中 / ${bonusStock==="BIG"?"7":"BAR"}を狙え（取りこぼし・持越し）`;
     updateBonusGlow();
   }
 }
 else if(currentRole==="BELL"){
   if(captured){
     const coins=bonusMode?15:8;
     awardCoins(coins);
     if(bonusMode)bonusTotal+=coins;
     msg=`ベル +${coins}枚`;
     try{SE.bell();}catch(e){}
   }else msg="ベル成立（取りこぼし）";
 }
 else if(currentRole==="REPLAY"){
   if(captured){
     replayReady=true;
     msg="REPLAY / 次ゲーム3枚掛け不要";
     try{SE.replay();}catch(e){}
   }else{
     // Safety fallback: internal replay still grants replay even on an impossible visual miss.
     replayReady=true;
     msg="REPLAY成立 / 再遊技";
   }
 }
 else if(currentRole==="WATERMELON"){
   flashCabinet("WATERMELON");
   if(captured){awardCoins(8);msg="スイカ +8枚";try{SE.rare();}catch(e){}}
   else msg="スイカ成立（取りこぼし）";
 }
 else if(currentRole==="WEAK_CHERRY"){
   flashCabinet("WEAK_CHERRY");
   if(captured){
     awardCoins(4);
     msg="弱チェリー（角） +4枚";
     playFileSE("seCherryFile",1,1);
   }else{
     msg="弱チェリー成立（取りこぼし）";
     playFileSE("seCherryFile",1,0.7);
   }
 }
 else if(currentRole==="STRONG_CHERRY"){
   flashCabinet("STRONG_CHERRY");
   if(captured){
     awardCoins(2);
     msg="強チェリー（中段） +2枚";
   }else{
     msg="強チェリー成立（取りこぼし）";
   }
   // 強チェリー成立SE：チェリー音を2連続
   playFileSE("seCherryFile",1.03,1);
   setTimeout(()=>playFileSE("seCherryFile",1.03,1),140);
 }
 else if(currentRole==="CHANCE"){
   flashCabinet("CHANCE");
   msg="チャンス目！";
   try{SE.chance();}catch(e){}
 }

 // If this game newly stocked a bonus, keep rainbow until 7/BAR is actually aligned.
 if(bonusStock && !bonusMode && currentRole!=="BIG_ALIGN" && currentRole!=="REG_ALIGN"){
   updateBonusGlow();
   msg+=` / ${bonusStock}内部成立！ ${bonusStock==="REG"&&currentRole==="WATERMELON"?"スイカ後もBAR狙い継続":"次G "+(bonusStock==="BIG"?"7":"BAR")+"を狙え"}`;
   mfRevealBonus();
 }

 if(bonusMode && currentRole!=="BIG_ALIGN" && currentRole!=="REG_ALIGN"){
   if(bonusTotal>=bonusTarget){
     msg+=` / ${endBonus()}`;
   }else{
     msg+=` / ${bonusMode} ${bonusTotal}/${bonusTarget}枚`;
   }
 }

 // 3-bet fixed: only replay carries the bet forward for free.
 if(replayReady){
   bet=BET_PER_GAME;
 }else{
   bet=0;
 }
 if(credit<BET_PER_GAME && !replayReady){
   ensureCredit();
   msg+=` / CREDIT自動補充`;
 }
 E("status").textContent=msg;
 sync();
}

function applyVolume(v){

 const pct=Math.round(masterVolume*100);
 const slider=E("volumeSlider"),label=E("volumeValue");
 if(slider)slider.value=pct;
 if(label)label.textContent=pct+"%";
 ["bgmBig1","bgmBig2","bgmBig3","bgmBar","seLeverFile","seStopFile","seBellFile","seReplayFile","seCherryFile","seTenpaiFile"].forEach(id=>{
   const a=E(id); if(a)a.volume=masterVolume;
 });
 if(reelMotorNodes && reelMotorNodes.g){
   reelMotorNodes.g.gain.value=.016*masterVolume;
 }
 if(masterVolume===0){
   soundOn=false;
   E("soundBtn").textContent="SOUND OFF";
   E("soundBtn").classList.add("off");
 }else if(!soundOn){
   soundOn=true;
   E("soundBtn").textContent="SOUND ON";
   E("soundBtn").classList.remove("off");
 }
}

/* ===== Ver.0.9.9 脳汁演出コントローラ ===== */
let mfEffect="NONE";
let mfSilentLever=false;
let mfThirdDelay=0;

function mfMachine(){
  return document.querySelector(".machine") || document.querySelector(".cabinet") || document.body;
}
function mfPickEffect(role, bonus){
  mfEffect="NONE"; mfSilentLever=false; mfThirdDelay=0;
  const r=Math.random();

  // ボーナス内部成立時ほど違和感・確定系が出やすい。演出なし当選も残す。
  if(bonus){
    if(r<0.08){mfEffect="SILENT";mfSilentLever=true;}
    else if(r<0.16){mfEffect="DELAY";}
    else if(r<0.24){mfEffect="STOP_TONE";}
    else if(r<0.32){mfEffect="THIRD_FREEZE";mfThirdDelay=520;}
    else if(r<0.39){mfEffect="BLACKOUT";}
    else if(r<0.47){mfEffect="RAINBOW";}
    else if(r<0.53){mfEffect="FROG";}
    else mfEffect="NONE";
  }else if(role==="STRONG_CHERRY" || role==="CHANCE"){
    if(r<0.05) mfEffect="DELAY";
    else if(r<0.09) mfEffect="STOP_TONE";
  }
}
function mfLeverCue(){
  const st=document.getElementById("status");
  if(mfEffect==="DELAY" && st){
    st.textContent="……";
    setTimeout(()=>{ if(st.textContent==="……") st.textContent="回転中… STOP!"; },260);
  }
}
function mfStopCue(n){
  if(mfEffect==="STOP_TONE" && n===2){
    // WebAudioだけの軽い違和感音。既存SEファイルには触れない。
    try{
      const C=window.AudioContext||window.webkitAudioContext;
      const c=new C(),o=c.createOscillator(),g=c.createGain();
      o.frequency.value=1040;g.gain.value=.035;o.connect(g);g.connect(c.destination);
      o.start();o.stop(c.currentTime+.055);
    }catch(e){}
  }
}
function mfRevealBonus(){
  const machine=mfMachine(), k=document.getElementById("mf-kakutei");
  if(mfEffect==="RAINBOW"){
    machine.classList.add("mf-rainbow");
    setTimeout(()=>machine.classList.remove("mf-rainbow"),1800);
  }else if(mfEffect==="BLACKOUT"){
    document.body.classList.add("mf-blackout");
    setTimeout(()=>{
      document.body.classList.remove("mf-blackout");
      if(k){k.classList.add("show");setTimeout(()=>k.classList.remove("show"),1200);}
    },420);
  }else if(mfEffect==="THIRD_FREEZE"){
    if(k){setTimeout(()=>{k.classList.add("show");setTimeout(()=>k.classList.remove("show"),1200)},mfThirdDelay);}
  }else if(mfEffect==="FROG"){
    const frogs=[...document.querySelectorAll('img[src*="frog"]')];
    if(frogs.length){
      const f=frogs[Math.floor(Math.random()*frogs.length)];
      f.classList.add("mf-redpulse");setTimeout(()=>f.classList.remove("mf-redpulse"),1000);
    }
  }
}

/* Ver.0.9.9.2 safe adjacent-symbol peeks */
const MF_IMG={
 seven:"images_symbols_seven.png",bar:"images_symbols_bar.png",
 bell:"images_symbols_bell.png",replay:"images_symbols_replay.png",
 cherry:"images_symbols_cherry.png",watermelon:"images_symbols_watermelon.png"
};
function mfWidePeeks(){
 ["left","center","right"].forEach(k=>{
   const el=document.getElementById("reel-"+k); if(!el||!R||!R[k])return;
   let top=el.querySelector(".mf-peek-top"), bot=el.querySelector(".mf-peek-bottom");
   if(!top){top=document.createElement("div");top.className="mf-peek-top";el.appendChild(top);}
   if(!bot){bot=document.createElement("div");bot.className="mf-peek-bottom";el.appendChild(bot);}
   const n=R[k].length;
   let idx=0;
   if(typeof displayIndex!=="undefined"&&displayIndex&&Number.isFinite(displayIndex[k])) idx=norm(Math.round(displayIndex[k]),n);
   else if(typeof stopIndex!=="undefined"&&stopIndex&&Number.isFinite(stopIndex[k])) idx=norm(stopIndex[k],n);
   const a=R[k][norm(idx-2,n)], b=R[k][norm(idx+2,n)];
   top.style.backgroundImage=MF_IMG[a]?`url("${MF_IMG[a]}")`:"none";
   bot.style.backgroundImage=MF_IMG[b]?`url("${MF_IMG[b]}")`:"none";
 });
}
window.addEventListener("load",()=>setTimeout(mfWidePeeks,50));


setInterval(()=>{try{mfWidePeeks()}catch(e){}},120);
